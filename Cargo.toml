[package]
name = "yosugano"
version = "0.2.0"
edition = "2024"

[lints.clippy]
ptr_arg = "allow"
len_zero = "allow"
unit_arg = "allow"
single_char_add_str = "allow"
needless_range_loop = "allow"
to_string_trait_impl = "allow"

[profile.release-pub]
inherits = "release"
panic = "abort"

[dependencies]
encoding_rs = { version = "0.8.35", features = ["fast-kanji-encode"] }
